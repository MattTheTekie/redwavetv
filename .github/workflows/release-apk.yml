name: Build and publish ARM32 release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 34 SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build release and test APKs
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          test -n "$DEBUG_APK"
          cp "$RELEASE_APK" dist/RedWaveTV-arm32-release-unsigned.apk
          cp "$DEBUG_APK" dist/RedWaveTV-arm32-test-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedWaveTV-arm32-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('RedWave TV build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: |
            dist/RedWaveTV-arm32-release-unsigned.apk
            dist/RedWaveTV-arm32-test-signed.apk
          body: |
            ARM32 (armeabi-v7a) builds. The release APK is unsigned; the test APK is signed with Android's standard debug test key for installation/testing only. Main-branch builds are rolling prereleases; version tags publish stable releases.
