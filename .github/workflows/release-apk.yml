name: Build and publish ARM32 release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 34 SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename unsigned APK
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" dist/RedWaveTV-arm32-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedWaveTV-arm32-release-apk
          path: dist/RedWaveTV-arm32-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/RedWaveTV-arm32-release.apk
          body: |
            ARM32 (armeabi-v7a) **unsigned** release APK. Android devices will reject this APK for installation until it is signed.
