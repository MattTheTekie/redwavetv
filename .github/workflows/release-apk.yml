name: Build and publish ARM32 release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Prepare release signing key (optional)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/redwavetv-release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/redwavetv-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK and record signing status
        id: apk
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" dist/RedWaveTV-arm32-release.apk
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedWaveTV-arm32-release-apk
          path: dist/RedWaveTV-arm32-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/RedWaveTV-arm32-release.apk
          body: |
            ARM32 (armeabi-v7a) release APK.
            ${{ steps.apk.outputs.signed == 'true' && 'This APK is signed using the repository release keystore secrets.' || 'WARNING: This APK is unsigned because release signing secrets were not configured. It cannot be installed until signed.' }}
