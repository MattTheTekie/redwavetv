plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv('RELEASE_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('RELEASE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
def releaseSigningReady = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.example.redwavetv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.redwavetv'
        minSdk 25
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
}
